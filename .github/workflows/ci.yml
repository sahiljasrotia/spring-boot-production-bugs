name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Runs the *Test classes (the fixes). The *BugDemo classes fail on purpose and are not
      # picked up by Surefire's default naming pattern.
      - run: mvn -B test
